[package]
name = "upurnaka"
version = "0.1.0"
edition = "2024"

# The application as a library, and a binary that calls it.
#
# `src/lib.rs` holds `initialize_application` — the database, the migrations,
# the auth policy, the router — and `src/main.rs` binds the public listener.
# The split is what lets an optional native package start the same application:
# Android has no `main` to reach, it loads a library and calls into it. See
# docs/conventions/native-packaging.md.
[lib]
name = "upurnaka"
path = "src/lib.rs"

[[bin]]
name = "upurnaka"
path = "src/main.rs"

# `native/` is the optional Tauri shell, written by `cargo rahti native init`.
# Excluded so that a web build never resolves a native dependency; it is its
# own workspace and is built from inside itself.
[workspace]
exclude = ["native"]

[dependencies]
axum = "0.8.9"
rahti = { version = "0.0.71", features = ["mcp", "ws"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "fs"] }

# The database. Yours to manage from here on: an upgrade adds a dependency
# a feature it just wrote needs, and changes nothing else in this file —
# a version bump is a version bump.
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
# Dilnaka Meet, the meeting provider (`src/meetings/dilnaka_meet.rs`). The
# same reqwest and rustls the `dilnaka` crate below already brings, so this
# adds no second TLS stack.
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rahti-icons = "=0.0.38"
argon2 = "0.6.0"
aes-gcm = "0.11.1"
base64 = "0.23.1"
rand = "0.10.3"
sha2 = "0.11.1"
totp-rs = { version = "6.0.0", default-features = false, features = ["std", "qr", "gen_secret"] }
# Meeting recordings go to Dilnaka Storage (`src/meetings/recording.rs`).
# It reads `DILNAKA_API_KEY` and brings its own rustls on ring.
dilnaka = "0.0.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
chrono = "0.4.45"

# What `src/tests/support.rs` needs to drive the generated router in-process:
# a request in, a response out, no port bound. See docs/conventions/testing.md.
[dev-dependencies]
hmac = "0.13.0"
rahti = { version = "0.0.71", features = ["browser-test"] }
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

# The suite's database. `src/tests/support.rs` opens a SQLite *file* per
# docs/conventions/testing.md, and the driver that reads it is a test-only
# concern: the deployment backend in rahti.config.json stays postgres, and the
# feature is unified into the dev build alone.
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite"] }

[build-dependencies]
rahti-build = "0.0.71"
