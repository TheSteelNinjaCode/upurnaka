[package]
name = "upurnaka"
version = "0.1.0"
edition = "2024"

# The application as a library, and a binary that calls it.
#
# `src/lib.rs` holds `initialize_application` — the database, the migrations,
# the auth policy, the router — and `src/main.rs` binds the public listener.
# The split is what lets an optional native package start the same application:
# Android has no `main` to reach, it loads a library and calls into it. See
# docs/conventions/native-packaging.md.
[lib]
name = "upurnaka"
path = "src/lib.rs"

[[bin]]
name = "upurnaka"
path = "src/main.rs"

# `native/` is the optional Tauri shell, written by `cargo rahti native init`.
# Excluded so that a web build never resolves a native dependency; it is its
# own workspace and is built from inside itself.
[workspace]
exclude = ["native"]

[dependencies]
axum = "0.8.9"
rahti = { version = "0.0.60", features = ["mcp", "ws"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["catch-panic", "fs"] }

# The database. Yours to manage from here on: an upgrade adds a dependency
# a feature it just wrote needs, and changes nothing else in this file —
# a version bump is a version bump.
sea-orm = { version = "2", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres"] }
sea-orm-migration = { version = "2", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
# AWS, with its TLS picked rather than inherited. Left on their defaults, these
# two crates build *two* complete TLS stacks: `default-https-client` pulls
# rustls 0.23 on aws-lc-rs — whose `aws-lc-sys` compiles ~68 MB of C through
# CMake, the most expensive crate in this graph — while the SDK's legacy
# `rustls` default pulls rustls 0.21 on ring alongside it. One is enough, and
# sea-orm/sqlx already resolves to ring, so both defaults are off here and the
# HTTPS client is chosen explicitly in `src/meetings/chime.rs`. Dropping
# `credentials-process` or `sso` would shrink the build further, but both are
# part of the documented credential fallback in that file, so they stay.
aws-config = { version = "1.13.0", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
    "credentials-process",
    "sso",
] }
aws-sdk-chimesdkmeetings = { version = "1.119.0", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
] }
# The one HTTPS client the two above now share. Naming it here is what makes
# `CryptoMode::Ring` available to `chime.rs` — and it is now the *only* client,
# because `default-https-client` is what would otherwise have supplied one.
aws-smithy-http-client = { version = "1.5.1", default-features = false, features = [
    "rustls-ring",
] }
rahti-icons = "=0.0.27"
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
totp-rs = { version = "5.7", features = ["qr", "gen_secret"] }

# What `src/tests/support.rs` needs to drive the generated router in-process:
# a request in, a response out, no port bound. See docs/conventions/testing.md.
[dev-dependencies]
hmac = "0.12"
rahti = { version = "0.0.60", features = ["browser-test"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# The suite's database. `src/tests/support.rs` opens a SQLite *file* per
# docs/conventions/testing.md, and the driver that reads it is a test-only
# concern: the deployment backend in rahti.config.json stays postgres, and the
# feature is unified into the dev build alone.
sea-orm = { version = "2", default-features = false, features = ["sqlx-sqlite"] }

[build-dependencies]
rahti-build = "0.0.60"
